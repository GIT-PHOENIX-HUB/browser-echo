<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 1rem;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 13px;
    }
    h1 {
      font-size: 1rem;
      color: #FF6B00;
      margin: 0 0 0.25rem 0;
    }
    .subtitle { color: #888; font-size: 0.8rem; margin-bottom: 1rem; }
    .status { margin-bottom: 1rem; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.connected { background: #4caf50; }
    .status-dot.disconnected { background: #f44336; }
    .btn {
      width: 100%;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .btn-primary { background: #FF6B00; color: white; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; }
    .settings { margin-top: 0.75rem; border-top: 1px solid #2a2a4a; padding-top: 0.75rem; }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    input[type="number"] {
      width: 50px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Browser Echo</h1>
  <p class="subtitle">BBB — Browser Blitz Builder</p>

  <div class="status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Checking...</span>
  </div>

  <button class="btn btn-primary" id="open-panel-btn">Open Side Panel</button>

  <div class="settings">
    <div class="setting-row">
      <span>Checkpoint reminder</span>
      <span><input type="number" id="checkpoint-mins" min="1" max="60" value="10"> min</span>
    </div>
    <div class="setting-row">
      <span>Auto-open on claude.ai</span>
      <input type="checkbox" id="auto-open" checked>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
